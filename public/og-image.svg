<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0b0b0c"/>

  <!-- Git graph motif: branch nodes off a main line -->
  <g stroke="#e8e4d8" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="96" y1="320" x2="540" y2="320"/>
    <path d="M 540 320 C 540 250, 620 250, 620 200"/>
    <line x1="620" y1="200" x2="760" y2="200"/>
    <path d="M 760 200 C 760 260, 840 260, 840 320"/>
    <line x1="540" y1="320" x2="1104" y2="320"/>
  </g>
  <g fill="#e8e4d8">
    <circle cx="96" cy="320" r="14"/>
    <circle cx="320" cy="320" r="14"/>
    <circle cx="540" cy="320" r="14"/>
    <circle cx="620" cy="200" r="14"/>
    <circle cx="760" cy="200" r="14"/>
    <circle cx="840" cy="320" r="14"/>
    <circle cx="1104" cy="320" r="14"/>
  </g>

  <!-- Wordmark -->
  <text x="96" y="468" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="700" fill="#f0ede6" letter-spacing="-2">git-agent</text>

  <!-- Tagline -->
  <text x="96" y="528" font-family="'IBM Plex Mono','IBM Plex Sans',monospace" font-size="32" font-weight="400" fill="#9a958a">AI-first Git CLI · conventional commits · atomic splits</text>

  <!-- Corner label -->
  <text x="1104" y="528" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="26" font-weight="500" fill="#6b675e">gitagent.dev</text>
</svg>
